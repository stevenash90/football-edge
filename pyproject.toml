[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-edge"
version = "0.1.0"
description = "EPL analytics: stats, Dixon-Coles match model, value-bet finder and FPL squad planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
football-edge = "football_edge.cli:main"

[tool.setuptools.packages.find]
include = ["football_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
